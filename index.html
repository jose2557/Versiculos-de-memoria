<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Estudio Bíblico</title>
<style>
:root{
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--bg4:#0d1b2a;
  --gold:#c9a84c;--gold2:#e8c86e;--gold3:#a07830;
  --text:#e8dcc8;--text2:#b8a88a;--text3:#887868;
  --green:#4caf7d;--red:#e05c5c;--blue:#5b8dee;
  --border:#2a2a40;--border2:#3a3a55;
  --card:#1e1e32;--card2:#252540;
  --radius:10px;--radius2:16px;
  --font-serif:'Georgia',serif;
  --font-sans:system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
a{color:var(--gold)}

/* ---- LAYOUT ---- */
#root{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:8px;height:52px;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:var(--font-serif);font-size:1.1rem;color:var(--gold);font-weight:bold;margin-right:auto}
.tab-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:6px 14px;border-radius:20px;font-size:0.88rem;transition:all .2s}
.tab-btn.active{background:var(--gold);color:#0f0f1a;font-weight:600}
.tab-btn:hover:not(.active){background:var(--border);color:var(--text)}
.content{flex:1;padding:16px;max-width:780px;margin:0 auto;width:100%}

/* ---- RACHA ---- */
.streak-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.streak-fire{font-size:1.6rem}
.streak-info{flex:1}
.streak-label{font-size:0.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.streak-num{font-size:1.5rem;font-weight:700;color:var(--gold);line-height:1}
.streak-dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--border2);transition:background .3s}
.dot.done{background:var(--gold)}
.dot.today{background:var(--gold2);box-shadow:0 0 6px var(--gold)}
.stats-mini{display:flex;gap:12px}
.stat-mini{text-align:center}
.stat-mini .val{font-size:1.1rem;font-weight:700;color:var(--text)}
.stat-mini .lbl{font-size:0.7rem;color:var(--text3)}

/* ---- CARDS generales ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;margin-bottom:12px}
.card2{background:var(--card2)}
.section-title{font-size:0.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

/* ---- VERSÍCULOS ---- */
.controls-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
label.ctrl-label{font-size:0.8rem;color:var(--text2);display:flex;align-items:center;gap:5px}
select.ctrl-sel{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:5px 9px;font-size:0.83rem;cursor:pointer}
input[type=number].ctrl-num{background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:5px;width:56px;font-size:0.83rem;text-align:center}
.toggle-sw{position:relative;width:34px;height:18px;flex-shrink:0}
.toggle-sw input{opacity:0;width:0;height:0;position:absolute}
.sw-track{position:absolute;inset:0;background:var(--border2);border-radius:9px;cursor:pointer;transition:.2s}
.sw-track:before{content:'';position:absolute;width:12px;height:12px;left:3px;top:3px;background:var(--text3);border-radius:50%;transition:.2s}
.toggle-sw input:checked+.sw-track{background:var(--gold3)}
.toggle-sw input:checked+.sw-track:before{transform:translateX(16px);background:var(--gold)}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:0.85rem;transition:all .15s}
.btn:hover{border-color:var(--gold3);color:var(--gold)}
.btn.primary{background:var(--gold);color:#0f0f1a;border-color:var(--gold);font-weight:600}
.btn.primary:hover{background:var(--gold2)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.success-btn{background:var(--green);color:#0f0f1a;border-color:var(--green);font-weight:600}
.btn.success-btn:hover{opacity:.9}
.btn-sm{padding:5px 10px;font-size:0.78rem}

/* ---- TARJETA VERSÍCULO ---- */
.verse-flip-wrap{perspective:1000px;margin-bottom:14px}
.verse-flip{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:140px}
.verse-flip.flipped{transform:rotateY(180deg)}
.verse-face{position:absolute;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;min-height:140px;display:flex;flex-direction:column;justify-content:center}
.verse-face.back{transform:rotateY(180deg);background:var(--bg3)}
/* spacer invisible que ocupa el mismo alto que la tarjeta para que el textarea quede debajo */
.verse-flip-spacer{visibility:hidden;pointer-events:none;padding:20px;min-height:140px}
.verse-ref{font-size:1.1rem;font-weight:700;color:var(--gold);font-family:var(--font-serif);margin-bottom:4px}
.verse-cat{display:inline-block;font-size:0.7rem;padding:2px 8px;background:var(--bg2);color:var(--gold3);border:1px solid var(--border2);border-radius:20px;margin-bottom:8px}
.verse-text-display{font-family:var(--font-serif);font-size:1rem;color:var(--text);line-height:1.7;font-style:italic}
.verse-hint{font-size:0.78rem;color:var(--text3);margin-top:8px}
textarea.answer-ta{width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:10px;font-size:0.9rem;resize:vertical;min-height:80px;font-family:var(--font-sans);box-sizing:border-box}
textarea.answer-ta:focus,input.answer-in:focus{outline:none;border-color:var(--gold3)}
input.answer-in{width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-size:0.9rem;box-sizing:border-box}
#v-card-wrap{width:100%;overflow:hidden;min-width:0}

/* ---- DIFF ---- */
.diff-area{margin-top:10px;padding:10px;background:var(--bg4);border-radius:8px;font-family:var(--font-serif);font-size:0.9rem;line-height:1.9;overflow-wrap:break-word;word-break:break-word;width:100%;box-sizing:border-box}
.dw{display:inline;padding:1px 3px;border-radius:3px;margin:1px 2px;white-space:normal;word-break:break-word}
.dw.ok{color:var(--green)}
.dw.wrong{background:rgba(224,92,92,.18);color:var(--red);text-decoration:line-through;font-size:.85em}
.dw.missing{background:rgba(201,168,76,.15);color:var(--gold2)}
.dw.extra{background:rgba(224,92,92,.1);color:var(--text3);font-size:.85em}
.accuracy{font-size:0.8rem;color:var(--text2);margin-top:6px}

/* ---- FEEDBACK ---- */
.feedback-bar{padding:8px 12px;border-radius:8px;font-size:0.85rem;margin-top:8px}
.feedback-bar.correct{background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.3)}
.feedback-bar.wrong{background:rgba(224,92,92,.15);color:var(--red);border:1px solid rgba(224,92,92,.3)}
.feedback-bar.skip{background:rgba(255,255,255,.05);color:var(--text2)}

/* ---- ACCIÓN BOTONES ---- */
.action-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.queue-info{font-size:0.75rem;color:var(--text3);padding:4px 0}
.completed-box{background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.2);border-radius:8px;padding:10px 12px;margin-top:10px}
.completed-box .lbl{font-size:0.72rem;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.completed-ref{font-size:0.82rem;color:var(--text2);padding:2px 0}

/* ---- SELECTOR MODAL ---- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2) var(--radius2) 0 0;padding:16px;width:100%;max-width:780px;max-height:85vh;overflow:auto}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-title{font-size:0.9rem;font-weight:600;color:var(--text)}
.search-in{width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:0.85rem;margin-bottom:10px}
.search-in:focus{outline:none;border-color:var(--gold3)}
.verse-row-sel{display:flex;align-items:flex-start;gap:8px;padding:8px;border-bottom:1px solid var(--border);font-size:0.82rem}
.verse-row-sel:hover{background:var(--card)}
.verse-row-sel input{margin-top:3px;accent-color:var(--gold);flex-shrink:0}
.vrs-ref2{font-weight:600;color:var(--gold);min-width:130px;font-size:.8rem}
.vrs-txt2{color:var(--text2);flex:1;font-style:italic;font-size:.78rem}
.sel-actions2{display:flex;gap:4px;flex-shrink:0}

/* ---- TOOLTIPS ---- */
.tip-wrap{position:relative;display:inline-flex;align-items:center}
.tip-icon{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--border2);color:var(--text3);font-size:9px;font-weight:700;cursor:help;margin-left:3px;flex-shrink:0;line-height:1}
.tip-box{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:0.75rem;color:var(--text2);white-space:nowrap;z-index:999;pointer-events:none;opacity:0;transition:opacity .15s;max-width:220px;white-space:normal;text-align:left;min-width:160px}
.tip-wrap:hover .tip-box{opacity:1}

/* ---- VERSÍCULOS — PANEL CATEGORÍAS ---- */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-tab{background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:5px 14px;font-size:0.8rem;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-tab:hover{border-color:var(--gold3);color:var(--gold)}
.cat-tab.active{background:var(--gold);color:#0f0f1a;border-color:var(--gold);font-weight:600}
.cat-section{display:none}
.cat-section.visible{display:block}
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.month-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 8px;cursor:pointer;text-align:center;transition:all .15s}
.month-btn:hover{border-color:var(--gold3);background:var(--card2)}
.month-btn.selected{border-color:var(--gold);background:rgba(201,168,76,.12)}
.month-btn .m-name{font-weight:600;color:var(--text);font-size:0.83rem}
.month-btn .m-count{font-size:0.7rem;color:var(--text3);margin-top:2px}
/* preview versículos de categoría */
.cat-preview{background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:10px}
.cat-preview-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:border-color .2s}
.cat-preview-hdr.open{border-bottom-color:var(--border)}
.cat-preview-hdr .ph-label{font-size:0.78rem;color:var(--text2)}
.cat-preview-hdr .ph-count{font-size:0.72rem;color:var(--text3);margin-left:auto;margin-right:8px}
.cat-preview-hdr .ph-arrow{font-size:0.65rem;color:var(--text3);transition:transform .2s;display:inline-block}
.cat-preview-hdr.open .ph-arrow{transform:rotate(180deg)}
.cat-preview-list{max-height:0;overflow:hidden;transition:max-height .3s ease}
.cat-preview-list.open{max-height:260px;overflow-y:auto}
.cat-prev-item{display:flex;gap:8px;padding:6px 12px;border-bottom:1px solid var(--border);font-size:0.78rem;align-items:baseline}
.cat-prev-item:last-child{border-bottom:none}
.cat-prev-num{color:var(--gold3);font-weight:700;min-width:20px;font-size:0.72rem}
.cat-prev-ref{color:var(--gold);min-width:140px;font-weight:600;font-size:0.78rem;flex-shrink:0}
.cat-prev-txt{color:var(--text3);font-style:italic;font-size:0.72rem;line-height:1.4}
.cat-start-row{display:flex;gap:8px;align-items:center;margin-top:10px}
/* evaluador cat-grid (sin cambios) */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;cursor:pointer;text-align:center;transition:all .15s}
.cat-card:hover{border-color:var(--gold3);background:var(--card2)}
.cat-card.active{border-color:var(--gold);background:rgba(201,168,76,.1)}
.cat-icon{font-size:1.6rem;margin-bottom:6px}
.cat-name{font-size:0.82rem;font-weight:600;color:var(--text)}
.cat-count{font-size:0.72rem;color:var(--text3);margin-top:2px}

.quiz-progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:14px;overflow:hidden}
.quiz-progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.quiz-num{font-size:0.75rem;color:var(--text3);text-align:right;margin-bottom:8px}
.quiz-source{font-size:0.7rem;color:var(--gold3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.quiz-q{font-size:1rem;color:var(--text);margin-bottom:14px;line-height:1.6;font-family:var(--font-serif);font-style:italic}

/* ---- RESULTADO FINAL ---- */
.result-circle{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;margin:0 auto 12px;border:3px solid var(--gold)}
.error-item-q{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.error-source{font-size:.7rem;color:var(--gold3);white-space:nowrap}
.error-q-text{color:var(--text2);flex:1}
.error-ans{color:var(--green);font-weight:600;white-space:nowrap}

/* ---- MENÚ INICIO ---- */
.home-hero{text-align:center;padding:20px 0 16px}
.home-title{font-family:var(--font-serif);font-size:1.8rem;color:var(--gold);margin-bottom:4px}
.home-sub{font-size:.85rem;color:var(--text2)}
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.module-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:20px 16px;cursor:pointer;transition:all .2s;text-align:center}
.module-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.module-icon{font-size:2rem;margin-bottom:8px;color:var(--gold)}
.module-name{font-weight:700;color:var(--text);margin-bottom:4px}
.module-desc{font-size:.78rem;color:var(--text3)}
.versiculo-dia{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 var(--radius) var(--radius) 0;padding:14px 16px;margin-top:16px}
.vd-label{font-size:.7rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.vd-text{font-family:var(--font-serif);font-size:.95rem;color:var(--text);font-style:italic;line-height:1.6;margin-bottom:4px}
.vd-ref{font-size:.78rem;color:var(--text2)}
/* ---- MICRÓFONO ---- */
.mic-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.mic-btn{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:0.83rem;color:var(--text2);transition:all .2s;flex-shrink:0}
.mic-btn:hover{border-color:var(--gold3);color:var(--gold)}
.mic-btn.listening{background:rgba(224,92,92,.15);border-color:var(--red);color:var(--red);animation:mic-pulse 1.2s ease-in-out infinite}
.mic-btn.listening .mic-dot{background:var(--red)}
.mic-btn.unsupported{opacity:.4;cursor:not-allowed}
.mic-icon{font-size:1rem;line-height:1}
.mic-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
.mic-status{font-size:0.75rem;color:var(--text3);font-style:italic;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mic-interim{font-size:0.8rem;color:var(--text3);font-style:italic;padding:6px 10px;background:var(--bg4);border-radius:6px;border-left:2px solid var(--border2);margin-top:4px;min-height:24px;line-height:1.4;word-break:break-word}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,92,92,.3)}50%{box-shadow:0 0 0 6px rgba(224,92,92,0)}}
@media(max-width:500px){
  .module-grid{grid-template-columns:1fr}
  .topbar-logo{font-size:.95rem}
  .tab-btn{padding:5px 10px;font-size:.8rem}
}
</style>
</head>
<body>
<div id="root">
  <div class="topbar">
    <span class="topbar-logo">✦ Biblia</span>
    <button class="tab-btn active" onclick="showTab('home')" id="tb-home">Inicio</button>
    <button class="tab-btn" onclick="showTab('vers')" id="tb-vers">Versículos</button>
    <button class="tab-btn" onclick="showTab('eval')" id="tb-eval">Evaluador</button>
  </div>
  <div class="content">
    <div id="tab-home"></div>
    <div id="tab-vers" style="display:none"></div>
    <div id="tab-eval" style="display:none"></div>
  </div>
</div>

<script>
/* ===================================================
   DATOS
   =================================================== */
const VERSES = [
{ref:"Génesis 1:1",text:"En el principio creó Dios el cielo y la tierra."},
{ref:"Josué 1:8",text:"El libro de esta ley nunca se apartará de tu boca: antes de día y de noche meditarás en él, para que guardes y hagas conforme a todo lo que en él está escrito: porque entonces harás prosperar tu camino, y todo te saldrá bien."},
{ref:"Josué 1:9",text:"Mira que te mando que te esfuerces y seas valiente: no temas ni desmayes, porque el SEÑOR tu Dios es contigo en donde quiera que fueres."},
{ref:"1 Crónicas 16:10",text:"Gloriaos en su santo nombre; alégrese el corazón de los que buscan al SEÑOR."},
{ref:"1 Crónicas 28:20",text:"Dijo más David a Salomón su hijo: Anímate y esfuérzate, y ponlo por obra; no temas, ni desmayes, porque el SEÑOR Dios, mi Dios, será contigo: él no te dejará, ni te desamparará, hasta que acabes toda la obra para el servicio de la casa del SEÑOR."},
{ref:"2 Crónicas 15:7",text:"Esforzaos pues vosotros, y no desfallezcan vuestras manos; que salario hay para vuestra obra."},
{ref:"Esdras 7:10",text:"Porque Esdras había preparado su corazón para inquirir la ley del SEÑOR, y para hacer y enseñar a Israel mandamientos y juicios."},
{ref:"Nehemías 4:18",text:"Porque los que edificaban, cada uno tenía su espada ceñida a sus lomos, y así edificaban: y el que tocaba la trompeta estaba junto a mí."},
{ref:"Salmo 27:1",text:"El SEÑOR es mi luz y mi salvación: ¿de quién temeré? el SEÑOR es la fortaleza de mi vida: ¿de quién he de atemorizarme?"},
{ref:"Salmo 37:4",text:"Pon asimismo tu delicia en el SEÑOR, y él te dará las peticiones de tu corazón."},
{ref:"Salmo 37:5",text:"Encomienda al SEÑOR tu camino, y espera en él; y él hará."},
{ref:"Salmo 112:7",text:"De mala fama no tendrá temor: su corazón está apercibido, confiado en el SEÑOR."},
{ref:"Salmo 119:9",text:"¿Con qué limpiará el joven su camino? Con guardar tu palabra."},
{ref:"Salmo 119:111",text:"Por heredad he tomado tus testimonios para siempre; porque son el gozo de mi corazón."},
{ref:"Salmo 126:6",text:"El que lleva la preciosa simiente, andando y llorando, volverá sin duda con regocijo, trayendo sus gavillas."},
{ref:"Salmo 133:1",text:"¡MIRAD cuán bueno y cuán agradable es habitar los hermanos juntos en unidad!"},
{ref:"Salmo 138:2",text:"Adoraré hacia tu santo templo, y alabaré tu nombre por tu misericordia y tu verdad: porque has magnificado tu palabra sobre todo tu nombre."},
{ref:"Proverbios 4:18",text:"Mas la senda de los justos es como la luz de la aurora, que va en aumento hasta el día perfecto."},
{ref:"Proverbios 10:5",text:"El que recoge en el verano es hijo sabio: pero el que duerme en el tiempo de la siega es hijo que avergüenza."},
{ref:"Proverbios 20:11",text:"Aun el muchacho es conocido por sus hechos, si su obra fuere limpia y recta."},
{ref:"Proverbios 27:17",text:"Hierro con hierro se aguza; y el hombre aguza el rostro de su amigo."},
{ref:"Eclesiastés 11:8",text:"Mas si el hombre viviere muchos años, y en todos ellos hubiere gozado alegría; si después trajere a la memoria los días de las tinieblas, que serán muchos, todo lo que le habrá pasado, dirá haber sido vanidad."},
{ref:"Jeremías 15:16",text:"Halláronse tus palabras, y yo las comí; y tu palabra me fue por gozo y por alegría de mi corazón: porque tu nombre se invocó sobre mí, oh SEÑOR Dios de los ejércitos."},

/* ===================================================
   UTILIDADES TEXTO
   =================================================== */
function nRef(r){
  if(!r)return'';
  return r.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\u2013\u2014]/g,'-').replace(/[(),.\\/\u2018\u2019\u201C\u201D]/g,'')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function nText(s){
  if(!s)return'';
  s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/[^A-Za-z0-9\u00C0-\u017F\s]/g,' ');
  return s.toLowerCase().replace(/\s+/g,' ').trim();
}
function diffWords(expected,actual){
  const te=nText(expected).split(' ').filter(Boolean);
  const ta=nText(actual).split(' ').filter(Boolean);
  const diffs=[];let correct=0;
  const max=Math.max(te.length,ta.length);
  for(let i=0;i<max;i++){
    const we=te[i]||null,wa=ta[i]||null;
    if(we===wa&&we!==null){diffs.push({t:'ok',e:we,a:wa});correct++;}
    else if(we&&!wa){diffs.push({t:'missing',e:we,a:''});}
    else if(!we&&wa){diffs.push({t:'extra',e:'',a:wa});}
    else{diffs.push({t:'wrong',e:we,a:wa});}
  }
  return{allOk:diffs.every(d=>d.t==='ok'),diffs,score:correct/Math.max(1,te.length)};
}
function normalizar(t){
  if(!t)return'';
  let s=t.toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/[^a-z0-9:\s-]/g,' ').replace(/\b(el|la|los|las|un|una|al|del|lo|y|e|con|por|para|de)\b/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function tokensR(t){
  if(!t)return[];
  let s=t.toString().replace(/\s+\/\s+|\/| - | -|-\s+|;|\band\b|\by\b|\be\b|&/gi,',');
  const parts=s.split(',').map(p=>p.trim()).filter(Boolean);
  const tokens=[];
  for(const part of parts){
    const n=normalizar(part);if(!n)continue;
    tokens.push(n);
    n.split(/\s+/).forEach(w=>{if(w&&!tokens.includes(w))tokens.push(w);});
  }
  return [...new Set(tokens)];
}
function compareQ(userRaw,correctArr){
  const uN=normalizar(userRaw);if(!uN)return false;
  const uT=tokensR(userRaw).map(t=>normalizar(t)).filter(Boolean);
  for(const rc of correctArr){
    const rcS=rc==null?'':rc.toString();
    const rcD=rcS.replace(/\D+/g,'');
    if(rcD&&/^\d+$/.test(rcD)&&uN.replace(/\D+/g,'')===rcD)return true;
    const rcT=tokensR(rcS).map(t=>normalizar(t)).filter(Boolean);
    if(rcT.length===0)continue;
    if(rcT.length===1){
      const solo=rcT[0];
      if(uN===solo||uT.includes(solo)||solo.split(' ').every(w=>uN.includes(w)))return true;
      continue;
    }
    const eParts=rcS.replace(/\s+\/\s+|\/| - | -|-\s+|;|&/g,',').split(',').map(s=>s.trim()).filter(Boolean);
    const eN=eParts.map(p=>normalizar(p)).filter(Boolean);
    const principales=eN.length>0?eN:rcT;
    if(principales.every(esp=>{
      if(uT.some(ut=>ut===esp))return true;
      return esp.split(/\s+/).every(pk=>uN.includes(pk));
    }))return true;
    if(principales.flatMap(p=>p.split(/\s+/)).every(pk=>uN.includes(pk)))return true;
  }
  return false;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function markActivityToday(){
  const sd=loadStreak();const t=today();
  if(sd.last===t)return sd;
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toISOString().slice(0,10);
  if(sd.last===yStr){sd.streak=(sd.streak||0)+1;}
  else if(sd.last!==t){sd.streak=1;}
  sd.last=t;sd.totalDays=(sd.totalDays||0)+1;
  saveStreak(sd);return sd;
}

/* ===================================================
   RACHA UI
   =================================================== */
function renderStreak(){
  const sd=loadStreak();
  const streak=sd.streak||0;
  const DAYS=7;
  let dots='';
  for(let i=0;i<DAYS;i++){
    const dayOff=DAYS-1-i;
    const d=new Date();d.setDate(d.getDate()-dayOff);
    const ds=d.toISOString().slice(0,10);
    let cls='dot';
    if(ds===sd.last)cls+=' today';
    else if(sd.last&&ds<sd.last){
      const diff=Math.floor((new Date(sd.last)-new Date(ds))/(86400000));
      if(diff<streak)cls+=' done';
    }
    dots+=`<div class="${cls}" title="${ds}"></div>`;
  }
  return`<div class="streak-bar">
    <div class="streak-fire">${streak>0?'🔥':'📖'}</div>
    <div class="streak-info">
      <div class="streak-label">Racha diaria</div>
      <div class="streak-num">${streak} día${streak!==1?'s':''}</div>
      <div class="streak-dots">${dots}</div>
    </div>
    <div class="stats-mini">
      <div class="stat-mini"><div class="val">${sd.totalVers||0}</div><div class="lbl">Versículos</div></div>
      <div class="stat-mini"><div class="val">${sd.totalQ||0}</div><div class="lbl">Preguntas</div></div>
      <div class="stat-mini"><div class="val">${sd.totalDays||0}</div><div class="lbl">Días</div></div>
    </div>
  </div>`;
}

let vState={queue:[],errorsQ:[],practiced:new Set(),difficulty:{},history:{},currentIdx:null,completedPerfect:new Set(),currentCat:'all'};

function tagCats(){
  const map={};
  for(const cat of Object.keys(CAT_LISTS))map[cat]=new Set(CAT_LISTS[cat].map(nRef));
  VERSES.forEach(v=>{
    const nr=nRef(v.ref);v.cats=[];
    for(const cat of Object.keys(map))if(map[cat].has(nr))v.cats.push(cat);
  });
}
tagCats();

function matchCat(idx){
  if(vState.currentCat==='all'||vState.currentCat==='custom')return true;
  if(vState.currentCat.startsWith('mes_')){
    const mes=vState.currentCat.replace('mes_','');
    const list=(MONTHLY_VERSES[mes]||[]).map(nRef);
    return list.includes(nRef(VERSES[idx].ref));
  }
  return(VERSES[idx].cats||[]).includes(vState.currentCat);
}
function loadVState(){
  const raw=localStorage.getItem(SK);if(!raw)return;
  try{
    const s=JSON.parse(raw);
    vState.queue=s.queue||[];vState.errorsQ=s.errorsQ||[];
    vState.practiced=new Set(s.practiced||[]);vState.difficulty=s.difficulty||{};
    vState.history=s.history||{};vState.currentIdx=s.currentIdx;
    vState.completedPerfect=new Set(s.completedPerfect||[]);
    vState.currentCat=s.currentCat||'all';
    vState.queue=vState.queue.filter(i=>matchCat(i));
    vState.errorsQ=vState.errorsQ.filter(i=>matchCat(i));
  }catch(e){}
}

function recDiff(idx,ok){
  if(!(idx in vState.difficulty))vState.difficulty[idx]=0;
  vState.difficulty[idx]=ok?Math.max(0,vState.difficulty[idx]-1):vState.difficulty[idx]+1;
  saveVState();
}
function requeue(idx){
  vState.queue=vState.queue.filter(i=>i!==idx);
  if(!vState.errorsQ.includes(idx))vState.errorsQ.push(idx);
  if(vState.queue.length===0){vState.queue.push(idx);return;}
  const pos=Math.min(2+Math.floor(Math.random()*4),vState.queue.length);
  vState.queue.splice(pos,0,idx);
}
function prepQueue(goal,useSRS){
  const t=today();const last=localStorage.getItem(DK);
  if(last!==t){if(vState.practiced.size>=VERSES.length)vState.practiced=new Set();localStorage.setItem(DK,t);vState.queue=[];}
  if(!(0 in vState.difficulty))VERSES.forEach((_,i)=>{if(!(i in vState.difficulty))vState.difficulty[i]=0;});
  if(vState.queue.length===0){
    let avail=VERSES.map((_,i)=>i).filter(i=>!vState.practiced.has(i)&&matchCat(i));
    if(!avail.length){vState.practiced=new Set();avail=VERSES.map((_,i)=>i).filter(i=>matchCat(i));}
    if(useSRS){
      avail.sort((a,b)=>(vState.difficulty[b]||0)-(vState.difficulty[a]||0));
      shuffle(avail);
      const rev=VERSES.map((_,i)=>i).filter(i=>vState.practiced.has(i)&&(vState.difficulty[i]||0)>0&&matchCat(i));
      rev.sort((a,b)=>(vState.difficulty[b]||0)-(vState.difficulty[a]||0));
      vState.queue=[...avail.slice(0,goal),...rev.slice(0,Math.floor(goal/3))];
    }else{
      shuffle(avail);vState.queue=avail.slice(0,Math.min(goal,avail.length));
    }
  }else{
    vState.queue=vState.queue.filter(i=>matchCat(i));
    vState.errorsQ=vState.errorsQ.filter(i=>matchCat(i));
  }
  saveVState();
}
function getNext(){if(vState.queue.length>0)return vState.queue.shift();if(vState.errorsQ.length>0)return vState.errorsQ.shift();return null;}

let vMode='normal',vSRS=true,vGoal=5,vTimer=false,vTimerStart=null;

function tip(text){
  return`<span class="tip-wrap"><span class="tip-icon">?</span><span class="tip-box">${text}</span></span>`;
}

const MESES_LABEL={enero:'Enero',febrero:'Febrero',marzo:'Marzo',abril:'Abril',mayo:'Mayo',junio:'Junio'};

/* Devuelve la lista de versículos para una categoría o mes dado */
function getVerseListForCat(cat){
  if(cat==='all') return VERSES.map((v,i)=>({idx:i,ref:v.ref,text:v.text}));
  if(cat.startsWith('mes_')){
    const mes=cat.replace('mes_','');
    const refs=(MONTHLY_VERSES[mes]||[]).map(nRef);
    return VERSES.map((v,i)=>({idx:i,ref:v.ref,text:v.text})).filter(v=>refs.includes(nRef(v.ref)));
  }
  return VERSES.map((v,i)=>({idx:i,ref:v.ref,text:v.text})).filter(v=>(VERSES[v.idx].cats||[]).includes(cat));
}

/* Genera el bloque desplegable con la lista de versículos */
function buildPreview(cat, label){
  const list=getVerseListForCat(cat);
  if(!list.length) return '';
  const items=list.map((v,i)=>`
    <div class="cat-prev-item">
      <span class="cat-prev-num">${i+1}</span>
      <span class="cat-prev-ref">${v.ref}</span>
      <span class="cat-prev-txt">${v.text.slice(0,80)}${v.text.length>80?'…':''}</span>
    </div>`).join('');
  const uid='prev_'+cat.replace(/[^a-z0-9]/gi,'_');
  return`<div class="cat-preview">
    <div class="cat-preview-hdr" id="${uid}_hdr" onclick="togglePreview('${uid}')">
      <span class="ph-label">📋 Versículos de ${label}</span>
      <span class="ph-count">${list.length} versículos</span>
      <span class="ph-arrow">▼</span>
    </div>
    <div class="cat-preview-list" id="${uid}_list">${items}</div>
  </div>`;
}

function togglePreview(uid){
  const hdr=document.getElementById(uid+'_hdr');
  const list=document.getElementById(uid+'_list');
  if(!hdr||!list)return;
  const isOpen=list.classList.contains('open');
  hdr.classList.toggle('open',!isOpen);
  list.classList.toggle('open',!isOpen);
}

function switchCatTab(tab){
  vCatTabActive=tab;
  // Mostrar/ocultar secciones sin re-render completo para no perder el estado del buscador
  ['fijas','mensuales','elige'].forEach(t=>{
    const sec=document.getElementById('tab-'+t);
    const btn=document.querySelector(`.cat-tab:nth-child(${t==='fijas'?1:t==='mensuales'?2:3})`);
    if(sec) sec.classList.toggle('visible',t===tab);
  });
  // Actualizar estilos de pestañas
  document.querySelectorAll('.cat-tab').forEach((el,i)=>{
    el.classList.toggle('active',['fijas','mensuales','elige'][i]===tab);
  });
  if(tab==='elige') renderSelTab();
}

function selectCatFija(cat){
  vState.currentCat=cat;
  vCatTabActive='fijas';
  vState.queue=[];
  vState.errorsQ=vState.errorsQ.filter(i=>matchCat(i));
  saveVState();
  renderVers();
}

function selectMes(mes){
  vMesSelected=mes;
  vCatTabActive='mensuales';
  // actualizar preview sin re-renderizar todo
  const previewEl=document.getElementById('preview-mes');
  if(previewEl) previewEl.innerHTML=buildPreview('mes_'+mes, MESES_LABEL[mes]);
  // marcar botón activo
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  // mostrar botón de inicio
  const startRow=document.getElementById('mes-start-row');
  if(startRow){
    startRow.style.display='flex';
    startRow.querySelector('strong').textContent=MESES_LABEL[mes];
  }
}

  }

    <div class="verse-flip-wrap">
      <div class="verse-flip" id="vflip">
        <div class="verse-face front">
          <div class="verse-ref">${v.ref}</div>${cats}

    <div class="verse-flip-wrap" style="margin-bottom:${spacerH+14}px;min-height:${spacerH}px">

function vCheck(){
  stopMic();
  const ans=(document.getElementById('v-ans')||{}).value||'';
  const idx=vCurrentIdx;if(idx===null)return;
  const v=VERSES[idx];
  const elapsed=vTimerStart?Math.round((Date.now()-vTimerStart)/1000):null;
  vTimerStart=null;
  const flip=document.getElementById('vflip');if(flip)flip.classList.add('flipped');
  const fb=document.getElementById('v-feedback');
  const diff=document.getElementById('v-diff');
  if(vMode==='normal'){
    const res=diffWords(v.text,ans);
    if(diff){
      let html='<div class="diff-area" style="overflow:hidden;max-width:100%">';
      res.diffs.forEach(d=>{
        if(d.t==='ok')html+=`<span class="dw ok">${d.e}</span> `;
        else if(d.t==='wrong')html+=`<span class="dw wrong">${d.a}</span><span class="dw missing">${d.e}</span> `;
        else if(d.t==='missing')html+=`<span class="dw missing">${d.e}</span> `;
        else html+=`<span class="dw extra">${d.a}</span> `;
      });
      html+=`</div><div class="accuracy">Precisión: ${Math.round(res.score*100)}%</div>`;
      diff.innerHTML=html;
    }
    if(res.allOk){
      vState.practiced.add(idx);recDiff(idx,true);
      vState.completedPerfect.add(v.ref);
      addVersStats(1);markActivityToday();
      fb.innerHTML=`<span class="feedback-bar correct">✓ Perfecto${elapsed!==null?' — '+elapsed+'s':''}</span>`;
      document.getElementById('v-next').style.display='inline-block';
      document.getElementById('v-check').style.display='none';
      document.getElementById('v-skip').style.display='none';
      document.getElementById('v-dontknow').style.display='none';
    }else{
      requeue(idx);recDiff(idx,false);
      fb.innerHTML=`<span class="feedback-bar wrong">✗ Hay errores — se repetirá${elapsed!==null?' — '+elapsed+'s':''}</span>`;
      document.getElementById('v-next').style.display='inline-block';
    }
  }else{
    const ok=nRef(v.ref)===nRef(ans);
    if(ok){
      vState.practiced.add(idx);recDiff(idx,true);
      vState.completedPerfect.add(v.ref);
      addVersStats(1);markActivityToday();
      fb.innerHTML=`<span class="feedback-bar correct">✓ Correcto: ${v.ref}${elapsed!==null?' — '+elapsed+'s':''}</span>`;
      document.getElementById('v-next').style.display='inline-block';
      document.getElementById('v-check').style.display='none';
      document.getElementById('v-skip').style.display='none';
      document.getElementById('v-dontknow').style.display='none';
    }else{
      requeue(idx);recDiff(idx,false);
      if(diff)diff.innerHTML=`<div class="diff-area" style="color:var(--text2)">Referencia correcta: <strong style="color:var(--gold)">${v.ref}</strong></div>`;
      fb.innerHTML=`<span class="feedback-bar wrong">✗ Incorrecto${elapsed!==null?' — '+elapsed+'s':''}</span>`;
      document.getElementById('v-next').style.display='inline-block';
    }
  }
  updateQInfo();renderCompleted();saveVState();
}
function vDontKnow(){
  stopMic();
  const idx=vCurrentIdx;if(idx===null)return;
  const flip=document.getElementById('vflip');if(flip)flip.classList.add('flipped');
  requeue(idx);recDiff(idx,false);
  document.getElementById('v-feedback').innerHTML=`<span class="feedback-bar skip">Programado para repetición</span>`;
  document.getElementById('v-next').style.display='inline-block';
  document.getElementById('v-check').style.display='none';
  document.getElementById('v-skip').style.display='none';
  document.getElementById('v-dontknow').style.display='none';
  updateQInfo();saveVState();
}
function vSkip(){
  stopMic();
  const idx=vCurrentIdx;if(idx!==null){requeue(idx);recDiff(idx,false);}
  document.getElementById('v-feedback').innerHTML=`<span class="feedback-bar skip">Saltado</span>`;

function vNext(){

function renderCompleted(){
  const box=document.getElementById('v-completed');if(!box)return;

}
function vReset(){
  if(!confirm('¿Reiniciar todo el progreso?'))return;
  localStorage.removeItem(SK);localStorage.removeItem(DK);
  vState={queue:[],errorsQ:[],practiced:new Set(),difficulty:{},history:{},currentIdx:null,completedPerfect:new Set(),currentCat:'all'};
  vCurrentIdx=null;
  renderVers();
}

/* ===================================================
   SELECTOR — ahora inline como tercera pestaña
   =================================================== */
let selSet=new Set();

function renderSelTab(){
  const container=document.getElementById('tab-elige');
  if(!container)return;
  const selCount=selSet.size;
  container.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
      <input class="search-in" id="sel-search" placeholder="Buscar por referencia, texto o categoría…" oninput="renderSelList()" style="flex:1;min-width:180px;margin:0"/>
      <button class="btn btn-sm" onclick="selAll()">Sel. todo</button>
      <button class="btn btn-sm" onclick="selNone()">Limpiar</button>
    </div>
    <div id="sel-list" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg4)"></div>
    <div class="cat-start-row" style="margin-top:10px;${selCount?'':'opacity:.45;pointer-events:none'}">
      <button class="btn primary" onclick="practiceSel()">▶ Practicar seleccionados</button>
      <span style="font-size:0.78rem;color:var(--text3)">${selCount?selCount+' versículo'+( selCount!==1?'s':'')+' elegido'+(selCount!==1?'s':''):'Ningún versículo elegido aún'}</span>
    </div>`;
  renderSelList();
}

function renderSelList(){
  const q=((document.getElementById('sel-search')||{}).value||'').toLowerCase().trim();
  const list=document.getElementById('sel-list');if(!list)return;
  list.innerHTML='';
  VERSES.forEach((v,idx)=>{
    const txt=(v.ref+' '+v.text+' '+(v.cats||[]).join(' ')).toLowerCase();
    if(q&&!txt.includes(q))return;
    const cats=(v.cats||[]).map(c=>`<span class="verse-cat">${c}</span>`).join('');
    const row=document.createElement('div');
    row.className='verse-row-sel';
    row.style.cssText='cursor:pointer';
    row.innerHTML=`
      <input type="checkbox" class="sel-cb" data-idx="${idx}" ${selSet.has(idx)?'checked':''}/>
      <div class="vrs-ref2">${v.ref} ${cats}</div>
      <div class="vrs-txt2">${v.text.slice(0,90)}${v.text.length>90?'…':''}</div>
      <div class="sel-actions2">
        <button class="btn btn-sm" title="Practicar solo este" onclick="practiceSingle(${idx})">▶</button>
      </div>`;
    list.appendChild(row);
  });
  list.querySelectorAll('.sel-cb').forEach(cb=>{
    cb.onchange=()=>{
      const i=parseInt(cb.dataset.idx);
      if(cb.checked)selSet.add(i);else selSet.delete(i);
      // actualizar contador sin re-render completo
      const row=document.getElementById('tab-elige');
      if(row){
        const cnt=row.querySelector('.cat-start-row span');
        const btn=row.querySelector('.cat-start-row');
        const n=selSet.size;
        if(cnt)cnt.textContent=n?n+' versículo'+(n!==1?'s':'')+' elegido'+(n!==1?'s':''):'Ningún versículo elegido aún';
        if(btn){btn.style.opacity=n?'1':'0.45';btn.style.pointerEvents=n?'auto':'none';}
      }
    };
  });
}

function selAll(){selSet=new Set(VERSES.map((_,i)=>i));renderSelTab();}
function selNone(){selSet=new Set();renderSelTab();}

function practiceSel(){
  if(!selSet.size)return;
  const arr=[...selSet];
  vState.queue=[...arr];
  vState.errorsQ=[];
  vState.currentCat='custom';
  saveVState();
  vGoal=Math.max(1,parseInt((document.getElementById('v-goal')||{}).value||5));
  vSRS=(document.getElementById('v-srs')||{}).checked!==false;
  vTimer=!!((document.getElementById('v-timer')||{}).checked);
  vMode=(document.getElementById('v-mode')||{}).value||'normal';
  document.getElementById('v-session').style.display='block';
  markActivityToday();
  renderCard(getNext());updateQInfo();
  document.getElementById('v-session').scrollIntoView({behavior:'smooth',block:'start'});
}

function practiceSingle(idx){
  vState.queue=[idx,...vState.queue.filter(x=>x!==idx)];
  vState.errorsQ=vState.errorsQ.filter(x=>x!==idx);
  vState.currentCat='custom';
  saveVState();
  document.getElementById('v-session').style.display='block';
  renderCard(getNext());updateQInfo();
  document.getElementById('v-session').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ===================================================
   EVALUADOR — estado
   =================================================== */
let qPregs=[],qIdx=0,qAciertos=0,qErrores=[],qRespondido=false,qTotal=0;

function renderEval(){
  const el=document.getElementById('tab-eval');
  el.innerHTML=`
  ${renderStreak()}
  <div class="card">
    <div class="section-title">Selecciona una categoría</div>
    <div class="cat-grid">
      <div class="cat-card" onclick="qSelectCat('soy')"><div class="cat-icon">🧍</div><div class="cat-name">¿Quién soy?</div><div class="cat-count">${QUIZ_DATA.soy.length} preguntas</div></div>
      <div class="cat-card" onclick="qSelectCat('dijo')"><div class="cat-icon">💬</div><div class="cat-name">¿Quién dijo?</div><div class="cat-count">${QUIZ_DATA.dijo.length} preguntas</div></div>
      <div class="cat-card" onclick="qSelectCat('generales')"><div class="cat-icon">📚</div><div class="cat-name">Generales</div><div class="cat-count">${QUIZ_DATA.generales.length} preguntas</div></div>
      <div class="cat-card" onclick="qSelectCat('libros')"><div class="cat-icon">📖</div><div class="cat-name">Libros de la Biblia</div><div class="cat-count">${LIBROS.length*2} preguntas</div></div>
      <div class="cat-card" onclick="qSelectCat('visiones')"><div class="cat-icon">✨</div><div class="cat-name">Visiones y Discipulado</div><div class="cat-count">${VISIONES.length+DISCIPULADO.length} temas</div></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn primary" id="q-start-btn" onclick="qStart()" style="display:none">▶ Iniciar</button>
    </div>
  </div>
  <div id="q-area"></div>`;
}
let qSelectedCat='';
function qSelectCat(cat){
  qSelectedCat=cat;
  document.querySelectorAll('.cat-card').forEach(c=>c.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('q-start-btn').style.display='inline-block';
}
function qStart(){
  if(!qSelectedCat)return;
  qErrores=[];
  if(qSelectedCat==='soy') qPregs=shuffle([...QUIZ_DATA.soy]).map(q=>({p:q.p,r:[q.r],s:'¿QUIÉN SOY?'}));
  else if(qSelectedCat==='dijo') qPregs=shuffle([...QUIZ_DATA.dijo]).map(q=>({p:q.p,r:[q.r],s:'¿QUIÉN DIJO?'}));
  else if(qSelectedCat==='generales') qPregs=shuffle([...QUIZ_DATA.generales]).map(q=>({p:q.p,r:[q.r],s:'GENERALES'}));
  else if(qSelectedCat==='libros'){
    qPregs=shuffle(LIBROS.map(lib=>{
      return Math.random()<0.5
        ?{p:`¿Cuántos capítulos tiene ${lib.n}?`,r:[String(lib.c)],s:'LIBROS'}
        :{p:`¿Qué número de libro es ${lib.n}?`,r:[String(lib.o)],s:'LIBROS'};
    }));
  }else if(qSelectedCat==='visiones'){
    const pool=[];
    VISIONES.forEach(v=>{
      pool.push({p:`VISIÓN ${v.y}: escribe el lema.`,r:[v.l],s:'VISIÓN'});
      pool.push({p:`VISIÓN: Lema "${v.l}" — escribe el año.`,r:[String(v.y)],s:'VISIÓN'});
      pool.push({p:`VISIÓN: Lema "${v.l}" — escribe la cita bíblica.`,r:[v.c],s:'VISIÓN'});
      pool.push({p:`VISIÓN: Para la cita ${v.c}, escribe el lema.`,r:[v.l],s:'VISIÓN'});
    });
    DISCIPULADO.forEach(d=>{
      pool.push({p:`DISCIPULADO #${d.o}: escribe la lección.`,r:[d.n],s:'DISCIPULADO'});
      pool.push({p:`DISCIPULADO: Lección "${d.n}" — escribe la cita bíblica.`,r:[d.c],s:'DISCIPULADO'});
      pool.push({p:`DISCIPULADO: Para la cita ${d.c}, escribe la lección.`,r:[d.n],s:'DISCIPULADO'});
    });
    shuffle(pool);qPregs=pool.slice(0,30);
  }
  if(!qPregs.length){alert('No hay preguntas.');return;}
  qIdx=0;qAciertos=0;qRespondido=false;qTotal=qPregs.length;
  markActivityToday();
  qRenderSession();
  qShow();
}
function qRenderSession(){
  document.getElementById('q-area').innerHTML=`
  <div class="card" style="margin-top:12px">
    <div class="quiz-progress"><div class="quiz-progress-fill" id="q-prog" style="width:0%"></div></div>
    <div class="quiz-num" id="q-num"></div>
    <div class="quiz-source" id="q-source"></div>
    <div class="quiz-q" id="q-question"></div>
    <input class="answer-in" id="q-ans" placeholder="Escribe tu respuesta…"/>
    <div id="q-feedback" style="margin-top:8px"></div>
    <div class="action-row" style="margin-top:10px">
      <button class="btn primary" onclick="qVerify()">Verificar</button>
      <button class="btn btn-sm" onclick="qNext()">Siguiente →</button>
    </div>
  </div>`;
  document.getElementById('q-ans').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();qVerify();}});
}
function qShow(){
  qRespondido=false;
  const fb=document.getElementById('q-feedback');
  const inp=document.getElementById('q-ans');
  if(!fb||!inp)return;
  fb.innerHTML='';inp.value='';inp.disabled=false;
  document.getElementById('q-num').textContent=`Pregunta ${qIdx+1} de ${qPregs.length}`;
  document.getElementById('q-source').textContent=qPregs[qIdx].s||'';
  document.getElementById('q-question').textContent=qPregs[qIdx].p;
  document.getElementById('q-prog').style.width=Math.round((qIdx/qTotal)*100)+'%';
  inp.focus();
}
function qVerify(){
  if(qRespondido)return;
  const inp=document.getElementById('q-ans');if(!inp)return;
  const fb=document.getElementById('q-feedback');
  inp.disabled=true;qRespondido=true;
  const ok=compareQ(inp.value,qPregs[qIdx].r);
  addQStats(1);
  if(ok){
    qAciertos++;
    fb.innerHTML=`<span class="feedback-bar correct">✓ Correcto</span>`;
  }else{
    qErrores.push({...qPregs[qIdx]});
    fb.innerHTML=`<span class="feedback-bar wrong">✗ Incorrecto — Respuesta: <strong style="color:var(--gold)">${qPregs[qIdx].r.join(' / ')}</strong></span>`;
  }
}
function qNext(){
  if(!qRespondido){qVerify();return;}
  qIdx++;
  if(qIdx>=qPregs.length)qFinalizar();
  else qShow();
}
function qFinalizar(){
  const pct=Math.round((qAciertos/qTotal)*100);
  let color=pct>=80?'var(--green)':pct>=50?'var(--gold)':'var(--red)';
  const errHtml=qErrores.length===0?'<p style="color:var(--green);text-align:center">¡Sin errores! 🏆</p>':
    qErrores.map((e,i)=>`<div class="error-item-q">
      <span class="error-source">${e.s}</span>
      <span class="error-q-text">${i+1}. ${e.p}</span>
      <span class="error-ans">${e.r.join(' / ')}</span>
    </div>`).join('');
  document.getElementById('q-area').innerHTML=`
  <div class="card" style="margin-top:12px;text-align:center">
    <div class="result-circle" style="border-color:${color};color:${color}">${pct}%</div>
    <div style="font-size:1.1rem;font-weight:600;margin-bottom:4px">${qAciertos} / ${qTotal} correctas</div>
    <div style="font-size:.85rem;color:var(--text2);margin-bottom:16px">${qErrores.length} errores</div>
    ${qErrores.length?`<div style="text-align:left;margin-bottom:12px"><div class="section-title">Preguntas incorrectas</div>${errHtml}</div>`:''}
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" onclick="renderEval()">← Menú</button>
      ${qErrores.length?`<button class="btn btn-sm" onclick="qPracticeErrors()">Practicar errores (${qErrores.length})</button>`:''}
    </div>
  </div>`;
}
function qPracticeErrors(){
  if(!qErrores.length)return;
  qPregs=[...qErrores];qErrores=[];
  qIdx=0;qAciertos=0;qRespondido=false;qTotal=qPregs.length;
  qRenderSession();qShow();
}

/* ===================================================
   MICRÓFONO — Web Speech API (compatible móvil + debug)
   =================================================== */
let micRecog=null;
let micActive=false;
let micFinalText='';
let micRestarting=false;
let micSessionCount=0;

const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition||null;
function micSupported(){return!!SpeechRec;}

function getMicEls(){
  return{
    btn:document.getElementById('mic-btn'),
    label:document.getElementById('mic-btn-label'),
    status:document.getElementById('mic-status'),
    interim:document.getElementById('mic-interim'),
    ta:document.getElementById('v-ans'),
    dbg:document.getElementById('mic-debug')
  };
}

function micLog(msg){
  const el=document.getElementById('mic-debug');
  if(!el)return;
  const t=new Date().toLocaleTimeString('es',{hour12:false});
  el.textContent='['+t+'] '+msg+'\n'+el.textContent.slice(0,400);
}

function toggleMic(){
  if(!micSupported()){
    const {status}=getMicEls();
    if(status)status.textContent='No soportado — usa Chrome o Safari';
    return;
  }
  if(micActive)stopMic();
  else startMic();
}

function startMic(){
  if(!micSupported()||micActive)return;
  const {btn,label,status,interim,ta}=getMicEls();
  if(!btn)return;

  micFinalText=(ta?ta.value:'').trimEnd();
  micActive=true;
  micRestarting=false;
  micSessionCount=0;

  btn.classList.add('listening');
  if(label)label.textContent='Detener';
  if(status)status.textContent='🎙 Iniciando…';
  if(interim){interim.style.display='block';interim.textContent='';}

  // Mostrar panel de debug
  const dbgWrap=document.getElementById('mic-debug-wrap');
  if(dbgWrap)dbgWrap.style.display='block';

  micLog('startMic() — SpeechRec='+SpeechRec.name);
  launchSession();
}

function launchSession(){
  if(!micActive)return;
  micSessionCount++;
  micLog('launchSession #'+micSessionCount);

  // Crear instancia nueva cada sesión — reutilizar la misma da problemas en Android
  micRecog=new SpeechRec();
  micRecog.lang='es-MX';       // es-MX más universal que es-PA en Android
  micRecog.continuous=false;
  micRecog.interimResults=true;
  micRecog.maxAlternatives=1;

  micRecog.onstart=()=>{
    micLog('onstart OK');
    const {status}=getMicEls();
    if(status)status.textContent='🎙 Escuchando… habla ahora';
  };

  micRecog.onaudiostart=()=>micLog('onaudiostart — audio capturado');
  micRecog.onsoundstart=()=>micLog('onsoundstart — sonido detectado');
  micRecog.onspeechstart=()=>micLog('onspeechstart — voz detectada ✓');
  micRecog.onspeechend=()=>micLog('onspeechend — voz terminó');
  micRecog.onsoundend=()=>micLog('onsoundend');
  micRecog.onaudioend=()=>micLog('onaudioend');

  micRecog.onresult=(e)=>{
    micLog('onresult — results:'+e.results.length);
    const {interim,ta}=getMicEls();
    let interimStr='';
    let newFinal='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      micLog((e.results[i].isFinal?'FINAL':'interim')+': "'+t.slice(0,40)+'"');
      if(e.results[i].isFinal){
        newFinal+=(newFinal?' ':'')+t.trim();
      }else{
        interimStr+=t;
      }
    }
    if(interim)interim.textContent=interimStr||'';
    if(newFinal){
      const sep=(micFinalText&&!micFinalText.endsWith(' '))?' ':'';
      micFinalText=micFinalText+sep+newFinal;
      if(ta){ta.value=micFinalText;ta.scrollTop=ta.scrollHeight;}
      if(interim)interim.textContent='';
    }
  };

  micRecog.onnomatch=()=>micLog('onnomatch — no reconoció nada');

  micRecog.onerror=(e)=>{
    micLog('onerror: '+e.error);
    if(e.error==='aborted')return;
    if(e.error==='no-speech'){
      if(micActive&&!micRestarting){
        micRestarting=true;
        setTimeout(()=>{micRestarting=false;launchSession();},400);
      }
      return;
    }
    const {status}=getMicEls();
    const msgs={
      'not-allowed':'Permiso denegado — activa micrófono en Ajustes',
      'network':'Sin conexión — el reconocedor necesita internet',
      'service-not-allowed':'Permiso denegado',
      'audio-capture':'No se encontró micrófono',
    };
    if(status)status.textContent=msgs[e.error]||'Error: '+e.error;
    stopMic(true);
  };

  micRecog.onend=()=>{
    micLog('onend — micActive='+micActive);
    if(micActive&&!micRestarting){
      micRestarting=true;
      setTimeout(()=>{
        micRestarting=false;
        if(micActive)launchSession();
      },300);
    }
  };

  try{
    micRecog.start();
    micLog('start() llamado');
  }catch(err){
    micLog('start() ERROR: '+err.name+' '+err.message);
    if(err.name==='InvalidStateError'){
      setTimeout(()=>{if(micActive)launchSession();},600);
    }else{
      const {status}=getMicEls();
      if(status)status.textContent='Error al iniciar: '+err.message;
      stopMic(true);
    }
  }
}

function stopMic(fromError=false){
  micActive=false;
  micRestarting=false;
  if(micRecog){
    try{micRecog.abort();}catch(e){}
    micRecog=null;
  }
  const {btn,label,status,interim,ta}=getMicEls();
  if(!btn)return;
  btn.classList.remove('listening');
  if(label)label.textContent='Dictar';
  if(interim){interim.style.display='none';interim.textContent='';}
  if(!fromError&&status){
    const words=ta&&ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
    status.textContent=words>0
      ?`✓ ${words} palabras — revisa y presiona Comprobar`
      :'Presiona Dictar, habla el versículo, luego Comprobar';
  }
  micLog('stopMic() — sesiones usadas: '+micSessionCount);
}
